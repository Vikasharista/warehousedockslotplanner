# SetuHaul dock solver defaults. Every value can be overridden with --config <file>.
# Agreed in the plan of record; change only with the operations team.

# Minutes after a truck's ETA before its slot may start (one buffer for every facility).
gate_buffer_min=30
# Extra minutes added to earliest_ready when the ETA confidence is LOW.
low_confidence_margin_min=15
# Slots starting within as_of + horizon_hours are planned.
horizon_hours=12
# A truck still in a dock past its expected unload end is assumed to need this many more minutes.
in_dock_overrun_min=15
# A driver's PENDING_CONFIRMATION hold blocks its slot for this many minutes after booked_at.
hold_expiry_min=15
# Fallback unload duration when neither the shipment nor the facility gives one.
default_unload_min=60

# Waiting-minute multipliers per priority (score level L4) and weights for L1 and L2.
priority_weight.LOW=1
priority_weight.NORMAL=3
priority_weight.HIGH=9
priority_weight.CRITICAL=27

# L4 penalties for moving a CONFIRMED booking: unforced (it was still feasible) and forced (it was not).
unforced_move_penalty=240
forced_move_penalty=30
# Keep feasible CONFIRMED bookings fixed (H12). false lets the solver move them, at the unforced penalty.
pin_feasible_confirmed=true

# Bumping: a CRITICAL truck may take the slot of a feasible CONFIRMED booking of a lower priority, which is then
# re-planned (it may end unassigned). Only bump_by trucks may use a bumped slot, each at most one; bookings
# starting within bump_freeze_min of the plan, trucks at the gate, flagged bookings and driver holds are never
# bumped. bump_penalty sits on the unassigned level (L1): it must be below every bump_by weight and at least
# every other weight, so that only placing a bump_by truck can pay for a bump.
bump_enabled=true
bump_by=CRITICAL
bump_victims=LOW,NORMAL
bump_freeze_min=120
bump_penalty=10

# Search limits. The run stops at whichever comes first.
solve_seconds=10
unimproved_seconds=2
random_seed=0

# Where the search starts. PRIORITY_FIRST: from the plan a careful planner would make by hand (highest priority
# first, each truck on its earliest free slot), so the result is never worse than that rule on the score. NONE: from
# an empty plan. FCFS: from first come, first served. Chosen in phase 6 after the baseline and stress comparisons.
warm_start=PRIORITY_FIRST

# A confirmed booking whose truck's effective ETA is this many minutes or more EARLIER than the ETA its slot was
# planned on is released (a forced move, reason ARRIVING_EARLY): the truck may take a free earlier slot, and keeps its
# own slot when there is none. No other booking moves for it. Keep equal to the solver service's ETA trigger
# (setuhaul.triggers.eta-shift-min), which starts the re-plan.
early_release_min=30
