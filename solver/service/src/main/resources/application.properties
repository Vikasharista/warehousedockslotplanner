# SetuHaul solver service.
quarkus.http.port=${SETUHAUL_SOLVER_PORT:8081}

# Times in API responses use the snapshot's zone (+05:30).
quarkus.jackson.timezone=Asia/Kolkata

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SETUHAUL_JDBC_URL:jdbc:postgresql://localhost:55432/setuhaul}
quarkus.datasource.username=${SETUHAUL_DB_USER:postgres}
quarkus.datasource.password=${SETUHAUL_DB_PASSWORD:postgres}
quarkus.datasource.devservices.enabled=false

# Optional file overriding solver-defaults.properties (weights, buffers, limits).
# setuhaul.solver.settings-file=/etc/setuhaul/solver.properties

# Safety net only: every request sets its own limit from the solver settings.
quarkus.timefold.solver.termination.spent-limit=60s

# Tests run against a seeded database given by SETUHAUL_TEST_JDBC_URL (see solver/README.md).
%test.quarkus.datasource.jdbc.url=${SETUHAUL_TEST_JDBC_URL:jdbc:postgresql://localhost:55432/setuhaul_test_unset}
%test.quarkus.http.test-port=0
