# Local Postgres for development and tests.
#   docker compose up -d db
#   export DATABASE_URL=postgresql://postgres:postgres@localhost:55432/setuhaul
#   export TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/postgres
services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: setuhaul
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
