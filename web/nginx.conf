server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8082;
        proxy_set_header Host $host;
        # The client address, for the sign-in limiter (Caddy in front sets the first entry in a deployment).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A re-plan solves and commits; allow it time.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
