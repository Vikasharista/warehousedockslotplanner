server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8082;
        proxy_set_header Host $host;
        # A re-plan solves and commits; allow it time.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
