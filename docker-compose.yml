# The whole planner on your machine:
#   docker compose up --build        then open http://localhost:5173
#   docker compose down -v           to start over from the snapshot (clock back to 4 Aug 2026, 09:55 IST)
#
# The first start also adds a load test: 70 generated truck requests (50 known at 09:55, 20 arriving between
# 10:00 and 17:00), with delays, a dock breakdown and coordinator cases. Change or turn it off on that first start:
#   SETUHAUL_SCENARIO_TRUCKS=0 docker compose up --build        (snapshot only)
#   SETUHAUL_SCENARIO_TRUCKS=100 SETUHAUL_SCENARIO_TRICKLE=40 docker compose up --build
#
# Only Postgres, for development and tests:
#   docker compose up -d db
#   export DATABASE_URL=postgresql://postgres:postgres@localhost:55432/setuhaul
#   export TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:55432/postgres
#
# Sign in at http://localhost:5173 with the local demo account demo@setuhaul.local / setuhaul-demo-2026
# (local only; a deployment sets its own accounts and secrets, see docs/deploy.md). Ports are bound to 127.0.0.1.
# Screens: Plan, Shipments, Capacity, Driver cases and a Driver chat test console. A driver agent can call
# http://localhost:8082/api/agent/... with the header X-Agent-Key: local-agent-key-for-development-only
services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: setuhaul
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Loads the snapshot, starts the shared clock at 09:55 and adds the generated trucks, the first time only;
  # later starts keep your data.
  seed:
    build:
      context: .
      dockerfile: jobs/Dockerfile
    image: setuhaul/jobs:local
    command: ["sh", "-c", "python -m setuhaul_jobs.seed --init && python -m setuhaul_jobs.scenario --once"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/setuhaul
      SETUHAUL_SCENARIO_TRUCKS: ${SETUHAUL_SCENARIO_TRUCKS:-70}
      SETUHAUL_SCENARIO_TRICKLE: ${SETUHAUL_SCENARIO_TRICKLE:-20}
    depends_on:
      db:
        condition: service_healthy

  # Simulated GPS on the three lanes and the ETA service every 30 seconds of real time; also fulfils the plan
  # view's "Add requests".
  gps:
    # Same image as seed. It needs its own build section, or Compose tries to pull it from Docker Hub.
    build:
      context: .
      dockerfile: jobs/Dockerfile
    image: setuhaul/jobs:local
    command: ["python", "-m", "setuhaul_jobs.gps.live", "--every-seconds", "30"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/setuhaul
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # Plans, commits and re-plans on its triggers (new request, ETA, check-in, every 15 minutes).
  solver:
    build:
      context: .
      dockerfile: solver/Dockerfile
    image: setuhaul/solver:local
    environment:
      SETUHAUL_JDBC_URL: jdbc:postgresql://db:5432/setuhaul
      SETUHAUL_DB_USER: postgres
      SETUHAUL_DB_PASSWORD: postgres
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # The plan view's API, driver holds, the input screens and the driver agent API.
  api:
    build:
      context: services
      dockerfile: dock-api/Dockerfile
    image: setuhaul/dock-api:local
    environment:
      APP_DATABASE_POSTGRES_DSN: postgres://postgres:postgres@db:5432/setuhaul?sslmode=disable
      APP_SOLVER_URL: http://solver:8081
      # Local development only. docker-compose.deploy.yml replaces both from your .env.
      APP_AUTH_JWT_SECRET: local-development-secret-not-for-deployment
      APP_AUTH_DEMO_ACCOUNTS: ${SETUHAUL_DEMO_ACCOUNTS:-demo@setuhaul.local:setuhaul-demo-2026}
      # Driver agents send this in X-Agent-Key to /api/agent/* (see docs/agent-api.md). Local key only.
      APP_AGENT_KEYS: ${SETUHAUL_AGENT_KEYS:-local-agent:local-agent-key-for-development-only}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # The driver chat agent (agent/): Telegram with TELEGRAM_TOKEN in .env (agent/README.md has the steps). Without a
  # token it starts and idles. It reaches the planner only through the api service's /api/agent/* with its key.
  agent:
    build:
      context: agent
    image: setuhaul/agent:local
    environment:
      PLANNER_URL: http://api:8082
      PLANNER_AGENT_KEY: ${SETUHAUL_AGENT_KEY:-local-agent-key-for-development-only}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      # Local testing only: lets you act as a seeded driver with /as +91-9000010009 (your own number is not seeded).
      ALLOW_PHONE_OVERRIDE: ${ALLOW_PHONE_OVERRIDE:-false}
      # Optional: read free text with Claude; rules otherwise.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - agentstate:/state
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: web
    image: setuhaul/web:local
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  agentstate:
